services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadagent
      POSTGRES_PASSWORD: leadagent
      POSTGRES_DB: leadagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadagent -d leadagent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://leadagent:leadagent@postgres:5432/leadagent
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-replace-me}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      DEMO_MODE: "true"
      SENDGRID_API_KEY: ""
      SENDGRID_FROM_EMAIL: ""
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      # Server-side only — Next.js rewrite proxies /proxy/* → backend
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
